<h1>About</h1>
<app-tabbed-pane #pane>
  <app-tab title="Upcoming Flights">
    <p>No upcoming flights!</p>
  </app-tab>
  <app-tab title="Operated Flights">
    <p>No operated flights!</p>
  </app-tab>
  <app-tab title="Cancelled Flights">
    <p>No cancelled flights!</p>
  </app-tab>
</app-tabbed-pane>

<button type="button" (click)="pane.activate(1)">Activate 2nd tab</button>
<button type="button" appClickWithWarning>Delete All!</button>

<button (appClickWithWarning)="deleteAll()" #cww="clickWithWarning">
  Delete All!
</button>
<button (click)="cww.handleClick(true)">Don't ask questions!</button>

<br />
<button
  appSimpleTooltip="Click here to book the flight"
  class="btn btn-default">
  Book Flight
</button>

<br />

<input
  [appTooltip]="tmpl"
  placeholder="Passenger Name"
  style="max-width: 200px"
/>

<ng-template
  #tmpl
  let-title="$implicit"
  let-body="text"
>
  <div class="tooltip">
    <h4>{{ title }}</h4>
    <p>{{ body }}</p>
  </div>
</ng-template>
