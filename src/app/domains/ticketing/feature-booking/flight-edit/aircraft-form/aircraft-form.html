<div class="form-group">
  <label for="type">Type:</label>
  <input id="type" class="form-control" [formField]="aircraft().type" />
  <app-validation-errors-pane [errors]="aircraft().type().errors()" />
</div>
<div class="form-group">
  <label for="registration">Registration:</label>
  <input id="registration" class="form-control" [formField]="aircraft().registration" />
  <app-validation-errors-pane [errors]="aircraft().registration().errors()" />
</div>
